<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bike Speedometer</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #263746 0%,
            #101820 42%,
            #080d12 100%
        );

    color: white;

    display: flex;
    justify-content: center;

    overflow-x: hidden;
}


/* MAIN APP */

.app {
    width: 100%;
    max-width: 460px;
    min-height: 100vh;

    padding:
        25px 20px 55px;

    position: relative;
}


/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 28px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.bike-icon {
    width: 48px;
    height: 48px;

    border-radius: 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    background:
        linear-gradient(
            145deg,
            #243b4d,
            #14222e
        );

    border: 1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 8px 25px rgba(0,0,0,0.35);
}

.title-area h1 {
    margin: 0;

    font-size: 22px;
    font-weight: 800;

    letter-spacing: 0.5px;
}

.title-area p {
    margin: 4px 0 0;

    font-size: 11px;

    color: #91a2ae;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}


/* GPS INDICATOR */

.gps-indicator {
    display: flex;
    align-items: center;
    gap: 6px;

    font-size: 11px;

    color: #8fa1ad;
}

.gps-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #35d07f;

    box-shadow:
        0 0 12px rgba(53,208,127,0.8);

    animation: pulse 1.8s infinite;
}

@keyframes pulse {

    0% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: 0.45;
        transform: scale(0.75);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


/* SPEEDOMETER */

.speed-card {

    position: relative;

    min-height: 330px;

    border-radius: 36px;

    padding: 35px 20px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(35,55,69,0.96),
            rgba(13,22,29,0.98)
        );

    border:
        1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 25px 70px rgba(0,0,0,0.45),

        inset 0 1px 0
        rgba(255,255,255,0.05);

    overflow: hidden;
}


/* Decorative circles */

.speed-card::before {

    content: "";

    position: absolute;

    width: 270px;
    height: 270px;

    border-radius: 50%;

    border:
        1px solid
        rgba(33,150,243,0.15);

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

}

.speed-card::after {

    content: "";

    position: absolute;

    width: 220px;
    height: 220px;

    border-radius: 50%;

    border:
        1px dashed
        rgba(255,255,255,0.07);

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

}


/* SPEED LABEL */

.speed-label {

    position: relative;

    z-index: 2;

    font-size: 12px;

    letter-spacing: 3px;

    color: #82939f;

    font-weight: 600;

    text-transform: uppercase;
}


/* SPEED NUMBER */

.speed {

    position: relative;

    z-index: 2;

    margin-top: 18px;

    font-size: 88px;

    line-height: 0.95;

    font-weight: 900;

    letter-spacing: -4px;

    text-shadow:
        0 0 25px rgba(33,150,243,0.18);
}


/* UNIT */

.unit {

    position: relative;

    z-index: 2;

    margin-top: 10px;

    font-size: 16px;

    font-weight: 700;

    letter-spacing: 4px;

    color: #6f8290;
}


/* STATUS */

.status {

    position: relative;

    z-index: 2;

    margin-top: 24px;

    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding:
        9px 15px;

    border-radius: 50px;

    background:
        rgba(255,255,255,0.045);

    border:
        1px solid rgba(255,255,255,0.06);

    color: #9daeb9;

    font-size: 11px;

    letter-spacing: 0.5px;
}


/* INFORMATION GRID */

.info {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 14px;

    margin-top: 16px;
}


/* INFO CARD */

.box {

    position: relative;

    padding: 20px 17px;

    min-height: 105px;

    border-radius: 23px;

    background:
        linear-gradient(
            145deg,
            rgba(29,45,57,0.95),
            rgba(15,24,31,0.95)
        );

    border:
        1px solid
        rgba(255,255,255,0.07);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,0.25);
}


/* Small top highlight */

.box::before {

    content: "";

    position: absolute;

    left: 17px;
    top: 0;

    width: 32px;
    height: 2px;

    border-radius: 10px;

    background:
        #2196f3;
}


/* INFO ICON */

.info-icon {

    font-size: 17px;

    margin-bottom: 8px;

    opacity: 0.85;
}


/* LABEL */

.label {

    font-size: 10px;

    color: #7f919e;

    text-transform: uppercase;

    letter-spacing: 1.3px;

    margin-bottom: 6px;
}


/* VALUE */

.value {

    font-size: 21px;

    font-weight: 800;

    color: #f2f6f8;
}


/* BUTTON */

button {

    width: 100%;

    margin-top: 18px;

    padding: 19px 20px;

    border: none;

    border-radius: 19px;

    font-size: 16px;

    font-weight: 800;

    letter-spacing: 2px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #2196f3,
            #1565c0
        );

    box-shadow:
        0 12px 30px
        rgba(33,150,243,0.25);

    cursor: pointer;

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;
}

button:active {

    transform: scale(0.97);

    box-shadow:
        0 6px 18px
        rgba(33,150,243,0.2);
}


button.stop {

    background:
        linear-gradient(
            135deg,
            #ef5350,
            #c62828
        );

    box-shadow:
        0 12px 30px
        rgba(229,57,53,0.25);
}


/* CREDIT */

.credit {

    position: fixed;

    right: 13px;
    bottom: 9px;

    font-size: 10px;

    color:
        rgba(255,255,255,0.32);

    letter-spacing: 0.4px;

    pointer-events: none;
}


/* SMALL SCREEN */

@media (max-height: 700px) {

    .app {
        padding-top: 18px;
    }

    .header {
        margin-bottom: 18px;
    }

    .speed-card {
        min-height: 285px;
        padding: 28px 15px;
    }

    .speed {
        font-size: 72px;
    }

    .info {
        margin-top: 12px;
    }

    .box {
        min-height: 92px;
        padding: 16px;
    }

    button {
        margin-top: 13px;
        padding: 16px;
    }
}

</style>
</head>


<body>


<div class="app">


    <!-- HEADER -->

    <div class="header">

        <div class="brand">

            <div class="bike-icon">
                🏍️
            </div>

            <div class="title-area">

                <h1>Bike Speedometer</h1>

                <p>Ride • Track • Measure</p>

            </div>

        </div>


        <div class="gps-indicator">

            <span class="gps-dot"></span>

            GPS

        </div>

    </div>



    <!-- SPEED -->

    <div class="speed-card">

        <div class="speed-label">
            Current Speed
        </div>


        <div
            id="speed"
            class="speed">
            0.0
        </div>


        <div class="unit">
            KM/H
        </div>


        <div
            id="status"
            class="status">

            <span class="gps-dot"></span>

            Ready to start

        </div>

    </div>



    <!-- INFORMATION -->

    <div class="info">


        <!-- GPS ACCURACY -->

        <div class="box">

            <div class="info-icon">
                📡
            </div>

            <div class="label">
                GPS Accuracy
            </div>

            <div
                id="accuracy"
                class="value">
                -- m
            </div>

        </div>



        <!-- DISTANCE -->

        <div class="box">

            <div class="info-icon">
                🛣️
            </div>

            <div class="label">
                Distance
            </div>

            <div
                id="distance"
                class="value">
                0 m
            </div>

        </div>

    </div>



    <!-- START BUTTON -->

    <button
        id="startButton"
        onclick="startTracking()">

        START RIDE

    </button>


</div>



<!-- CREDIT -->

<div class="credit">
    Created by Guruling Gaidhankar
</div>



<script>


let watchId = null;

let previousPosition = null;

let totalDistance = 0;



/* ELEMENTS */

const speedElement =
    document.getElementById("speed");

const accuracyElement =
    document.getElementById("accuracy");

const distanceElement =
    document.getElementById("distance");

const statusElement =
    document.getElementById("status");

const startButton =
    document.getElementById("startButton");



/* START */

function startTracking() {

    if (!navigator.geolocation) {

        alert(
            "Geolocation is not supported on this device."
        );

        return;
    }


    totalDistance = 0;

    previousPosition = null;


    speedElement.textContent = "0.0";

    distanceElement.textContent = "0 m";

    accuracyElement.textContent = "-- m";


    statusElement.innerHTML =
        '<span class="gps-dot"></span> Getting GPS location...';


    startButton.textContent =
        "STOP RIDE";

    startButton.classList.add("stop");

    startButton.onclick =
        stopTracking;



    watchId =
        navigator.geolocation.watchPosition(

            handleLocation,

            handleError,

            {

                enableHighAccuracy: true,

                maximumAge: 1000,

                timeout: 10000

            }

        );

}



/* LOCATION */

function handleLocation(position) {

    const latitude =
        position.coords.latitude;

    const longitude =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;



    /* ACCURACY */

    accuracyElement.textContent =
        accuracy.toFixed(1) + " m";



    /* SPEED */

    let speedKmh = 0;


    if (

        position.coords.speed !== null &&

        position.coords.speed >= 0

    ) {

        speedKmh =
            position.coords.speed * 3.6;

    }



    /*
       Fallback speed calculation
    */

    if (

        (
            position.coords.speed === null ||
            position.coords.speed < 0
        )

        &&

        previousPosition !== null

    ) {

        const movement =
            calculateDistance(

                previousPosition.coords.latitude,

                previousPosition.coords.longitude,

                latitude,

                longitude

            );


        const time =
            (
                position.timestamp -
                previousPosition.timestamp
            ) / 1000;


        if (time > 0) {

            speedKmh =
                (movement / time) * 3.6;

        }

    }



    /* DISTANCE */

    if (previousPosition !== null) {

        const movement =
            calculateDistance(

                previousPosition.coords.latitude,

                previousPosition.coords.longitude,

                latitude,

                longitude

            );


        /*
           Ignore poor GPS points
           and tiny GPS drift.
        */

        if (

            accuracy <= 20 &&

            movement >= 1

        ) {

            totalDistance += movement;

        }

    }


    previousPosition =
        position;



    /* PROTECT AGAINST GPS SPIKES */

    if (speedKmh > 200) {

        speedKmh = 0;

    }



    /* DISPLAY */

    speedElement.textContent =
        speedKmh.toFixed(1);


    distanceElement.textContent =
        formatDistance(totalDistance);


    statusElement.innerHTML =
        '<span class="gps-dot"></span> GPS tracking active';

}



/* DISTANCE CALCULATION */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;


    const dLat =
        toRadians(lat2 - lat1);


    const dLon =
        toRadians(lon2 - lon1);


    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2)

        +

        Math.cos(
            toRadians(lat1)
        )

        *

        Math.cos(
            toRadians(lat2)
        )

        *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);



    const c =
        2 * Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1 - a)

        );


    return R * c;

}



/* RADIANS */

function toRadians(degrees) {

    return degrees *
        Math.PI / 180;

}



/* DISTANCE FORMAT */

function formatDistance(meters) {

    if (meters < 1000) {

        return (
            meters.toFixed(1)
            + " m"
        );

    }


    return (

        meters / 1000

    ).toFixed(2) + " km";

}



/* STOP */

function stopTracking() {

    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;

    }


    statusElement.innerHTML =
        "Ride stopped";


    startButton.textContent =
        "START RIDE";


    startButton.classList.remove(
        "stop"
    );


    startButton.onclick =
        startTracking;

}



/* ERROR */

function handleError(error) {

    let message = "";


    switch (error.code) {

        case error.PERMISSION_DENIED:

            message =
                "Location permission denied.";

            break;


        case error.POSITION_UNAVAILABLE:

            message =
                "GPS location unavailable.";

            break;


        case error.TIMEOUT:

            message =
                "GPS request timed out.";

            break;


        default:

            message =
                "Unknown GPS error.";

    }


    statusElement.innerHTML =
        "⚠️ " + message;

}

</script>

</body>
</html>
