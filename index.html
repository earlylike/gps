<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Bike Speedometer</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    min-height: 100vh;
    background:
        radial-gradient(circle at top, #18243d 0%, #090d16 45%, #05070b 100%);

    color: white;
    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.app {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    padding: 22px 18px 20px;

    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.bike-icon {
    width: 46px;
    height: 46px;

    border-radius: 14px;

    background: linear-gradient(145deg, #1d9bf0, #1266d8);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;

    box-shadow:
        0 8px 25px rgba(30, 144, 255, 0.28);
}

.brand-text h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.2px;
}

.brand-text p {
    margin-top: 3px;
    font-size: 11px;
    color: #8290a8;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

/* GPS STATUS */

.gps-status {
    display: flex;
    align-items: center;
    gap: 7px;

    padding: 8px 11px;

    border-radius: 20px;

    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.07);

    font-size: 10px;
    color: #91a0b8;
}

.gps-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ffb020;

    box-shadow: 0 0 10px rgba(255,176,32,0.7);

    transition: 0.3s;
}

.gps-dot.active {
    background: #24e08b;
    box-shadow: 0 0 10px rgba(36,224,139,0.8);
}

/* SPEED CARD */

.speed-card {
    position: relative;

    margin-top: 5px;

    padding: 34px 20px 30px;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(25, 38, 62, 0.96),
            rgba(10, 16, 27, 0.96)
        );

    border: 1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 25px 70px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.03);

    text-align: center;

    overflow: hidden;
}

.speed-card::before {
    content: "";

    position: absolute;

    width: 230px;
    height: 230px;

    top: -130px;
    left: 50%;
    transform: translateX(-50%);

    background: rgba(25,145,255,0.13);

    filter: blur(50px);

    pointer-events: none;
}

.speed-label {
    position: relative;

    font-size: 12px;
    color: #8391a8;

    letter-spacing: 3px;
    text-transform: uppercase;

    margin-bottom: 8px;
}

.speed {
    position: relative;

    font-size: clamp(78px, 22vw, 118px);

    line-height: 0.95;

    font-weight: 800;

    letter-spacing: -5px;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #d9e8ff 45%,
            #6daeff 100%
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow:
        0 0 35px rgba(40,145,255,0.15);
}

.unit {
    position: relative;

    margin-top: 8px;

    font-size: 15px;

    color: #7f8da5;

    letter-spacing: 3px;
}

/* INFO */

.info-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 13px;

    margin-top: 16px;
}

.info-card {
    min-height: 95px;

    padding: 17px;

    border-radius: 21px;

    background:
        rgba(17, 25, 39, 0.88);

    border: 1px solid rgba(255,255,255,0.07);

    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.info-title {
    font-size: 10px;

    color: #718098;

    text-transform: uppercase;

    letter-spacing: 1.5px;
}

.info-value {
    font-size: 24px;

    font-weight: 750;

    color: #f4f7fb;
}

.info-unit {
    font-size: 11px;
    color: #76859d;
    margin-left: 3px;
}

/* BUTTON */

.start-button {
    width: 100%;

    margin-top: 18px;

    border: none;

    min-height: 61px;

    border-radius: 20px;

    color: white;

    font-size: 15px;

    font-weight: 800;

    letter-spacing: 2px;

    background:
        linear-gradient(
            135deg,
            #168cff,
            #0757c9
        );

    box-shadow:
        0 12px 30px rgba(0, 110, 255, 0.28);

    cursor: pointer;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.start-button:active {
    transform: scale(0.97);
}

.start-button.stop {
    background:
        linear-gradient(
            135deg,
            #ff4d5e,
            #c91f38
        );

    box-shadow:
        0 12px 30px rgba(255, 45, 70, 0.22);
}

/* FOOTER */

.footer {
    margin-top: auto;

    text-align: right;

    padding-top: 18px;

    font-size: 9px;

    color: rgba(255,255,255,0.28);

    letter-spacing: 0.5px;
}

/* SMALL DEVICES */

@media (max-height: 700px) {
    .app {
        padding-top: 15px;
    }

    .header {
        margin-bottom: 15px;
    }

    .speed-card {
        padding: 25px 18px 22px;
    }

    .speed {
        font-size: 82px;
    }

    .info-card {
        min-height: 82px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="brand">

            <div class="bike-icon">
                🏍️
            </div>

            <div class="brand-text">
                <h1>Bike Speedometer</h1>
                <p>Ride • Track • Measure</p>
            </div>

        </div>

        <div class="gps-status">

            <div id="gpsDot" class="gps-dot"></div>

            <span id="gpsText">GPS OFF</span>

        </div>

    </div>


    <!-- SPEED -->

    <div class="speed-card">

        <div class="speed-label">
            Current Speed
        </div>

        <div id="speed" class="speed">
            0.0
        </div>

        <div class="unit">
            KM/H
        </div>

    </div>


    <!-- INFORMATION -->

    <div class="info-grid">

        <div class="info-card">

            <div class="info-title">
                GPS Accuracy
            </div>

            <div class="info-value">
                <span id="accuracy">--</span>
                <span class="info-unit">m</span>
            </div>

        </div>


        <div class="info-card">

            <div class="info-title">
                Distance
            </div>

            <div class="info-value">
                <span id="distance">0.00</span>
                <span class="info-unit">km</span>
            </div>

        </div>

    </div>


    <!-- BUTTON -->

    <button
        id="startButton"
        class="start-button"
        onclick="toggleTracking()">

        START RIDE

    </button>


    <!-- CREDIT -->

    <div class="footer">
        Created by Guruling Gaidhankar
    </div>

</div>


<script>

let watchId = null;

let lastPosition = null;

let totalDistance = 0;

let tracking = false;


/*
    SPEED FILTER SETTINGS

    These values are designed to prevent GPS drift
    from showing fake speed while standing still.
*/

const STATIONARY_SPEED_LIMIT = 1.5; // km/h

const MIN_MOVEMENT_METERS = 2.0;

const MAX_REASONABLE_SPEED = 200; // km/h

const MAX_GOOD_ACCURACY = 25; // meters


/*
    Small speed history for smoothing
*/

let speedHistory = [];


/* -----------------------------------------
   HAVERSINE DISTANCE
----------------------------------------- */

function calculateDistance(lat1, lon1, lat2, lon2) {

    const R = 6371000;

    const dLat =
        (lat2 - lat1) * Math.PI / 180;

    const dLon =
        (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c =
        2 * Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}


/* -----------------------------------------
   SPEED FILTER
----------------------------------------- */

function getStableSpeed(position) {

    const current = position.coords;

    const currentTime = position.timestamp;

    const accuracy = current.accuracy || 999;


    /*
        First GPS point:
        We don't yet know how fast we are moving.
    */

    if (!lastPosition) {

        lastPosition = position;

        speedHistory = [];

        return 0;
    }


    const previous = lastPosition.coords;

    const previousTime = lastPosition.timestamp;


    const timeSeconds =
        (currentTime - previousTime) / 1000;


    /*
        Ignore impossible GPS timestamps.
    */

    if (timeSeconds <= 0) {

        return 0;
    }


    /*
        Calculate actual movement between GPS points.
    */

    const movementMeters =
        calculateDistance(
            previous.latitude,
            previous.longitude,
            current.latitude,
            current.longitude
        );


    /*
        Calculate speed ourselves from GPS movement.
    */

    const calculatedSpeed =
        (movementMeters / timeSeconds) * 3.6;


    /*
        GPS can provide its own speed value.
    */

    let gpsSpeed = null;

    if (
        current.speed !== null &&
        current.speed !== undefined &&
        !isNaN(current.speed) &&
        current.speed >= 0
    ) {

        gpsSpeed =
            current.speed * 3.6;
    }


    /*
        IMPORTANT:

        GPS position can move a few meters even when
        the bike is completely stationary.

        Therefore, tiny movements are considered GPS drift.
    */

    const movementThreshold =
        Math.max(
            MIN_MOVEMENT_METERS,
            accuracy * 0.25
        );


    /*
        If movement is smaller than the GPS uncertainty,
        treat the bike as stationary.
    */

    if (
        movementMeters < movementThreshold
    ) {

        lastPosition = position;

        speedHistory = [];

        return 0;
    }


    /*
        If calculated movement speed is extremely low,
        treat it as stationary too.
    */

    if (
        calculatedSpeed < STATIONARY_SPEED_LIMIT
    ) {

        lastPosition = position;

        speedHistory = [];

        return 0;
    }


    /*
        When GPS accuracy is poor, don't allow tiny
        reported speeds to appear.
    */

    if (
        accuracy > MAX_GOOD_ACCURACY &&
        (
            gpsSpeed === null ||
            gpsSpeed < 5
        )
    ) {

        lastPosition = position;

        speedHistory = [];

        return 0;
    }


    /*
        Select the best speed value.
    */

    let speed;

    if (
        gpsSpeed !== null &&
        gpsSpeed <= MAX_REASONABLE_SPEED
    ) {

        /*
            GPS speed is generally better for actual
            vehicle movement.
        */

        speed = gpsSpeed;

    } else {

        speed = calculatedSpeed;
    }


    /*
        Prevent very small fake speeds.
    */

    if (
        speed < STATIONARY_SPEED_LIMIT
    ) {

        lastPosition = position;

        speedHistory = [];

        return 0;
    }


    /*
        Add speed to smoothing history.
    */

    speedHistory.push(speed);


    /*
        Keep only the latest 3 readings.
    */

    if (speedHistory.length > 3) {

        speedHistory.shift();
    }


    /*
        Average recent valid readings.
    */

    let averageSpeed =
        speedHistory.reduce(
            (sum, value) => sum + value,
            0
        ) / speedHistory.length;


    /*
        Update last position.
    */

    lastPosition = position;


    return averageSpeed;
}


/* -----------------------------------------
   LOCATION SUCCESS
----------------------------------------- */

function handleLocation(position) {

    const accuracy =
        position.coords.accuracy;


    document.getElementById("accuracy").textContent =
        accuracy
            ? Math.round(accuracy)
            : "--";


    /*
        GPS is active
    */

    document
        .getElementById("gpsDot")
        .classList.add("active");


    document.getElementById("gpsText").textContent =
        "GPS ACTIVE";


    /*
        Calculate stable filtered speed.
    */

    const speed =
        getStableSpeed(position);


    /*
        Show speed.
    */

    document.getElementById("speed").textContent =
        speed.toFixed(1);


    /*
        Distance calculation.

        We only add meaningful movement
        when GPS accuracy is reasonably good.
    */

    if (lastPosition) {

        const previous =
            lastPosition.coords;

        const movement =
            calculateDistance(
                previous.latitude,
                previous.longitude,
                position.coords.latitude,
                position.coords.longitude
            );


        /*
            Prevent GPS drift from adding distance
            while standing still.
        */

        const distanceThreshold =
            Math.max(
                2,
                accuracy * 0.25
            );


        if (
            accuracy <= 20 &&
            movement >= distanceThreshold &&
            movement < 1000
        ) {

            totalDistance += movement;
        }
    }


    document.getElementById("distance").textContent =
        (totalDistance / 1000).toFixed(2);
}


/* -----------------------------------------
   LOCATION ERROR
----------------------------------------- */

function handleError(error) {

    document
        .getElementById("gpsDot")
        .classList.remove("active");


    document.getElementById("gpsText").textContent =
        "GPS ERROR";


    /*
        If GPS is lost, don't keep showing
        the previous speed.
    */

    document.getElementById("speed").textContent =
        "0.0";


    speedHistory = [];
}


/* -----------------------------------------
   START TRACKING
----------------------------------------- */

function startTracking() {

    if (!navigator.geolocation) {

        alert("GPS is not supported on this device.");

        return;
    }


    tracking = true;


    document.getElementById("startButton").textContent =
        "STOP RIDE";


    document
        .getElementById("startButton")
        .classList.add("stop");


    document.getElementById("gpsText").textContent =
        "SEARCHING GPS";


    /*
        Reset current GPS reference.
    */

    lastPosition = null;

    speedHistory = [];


    watchId =
        navigator.geolocation.watchPosition(
            handleLocation,
            handleError,
            {

                enableHighAccuracy: true,

                maximumAge: 1000,

                timeout: 10000

            }
        );
}


/* -----------------------------------------
   STOP TRACKING
----------------------------------------- */

function stopTracking() {

    tracking = false;


    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;
    }


    document.getElementById("startButton").textContent =
        "START RIDE";


    document
        .getElementById("startButton")
        .classList.remove("stop");


    document
        .getElementById("gpsDot")
        .classList.remove("active");


    document.getElementById("gpsText").textContent =
        "GPS OFF";


    /*
        Stop displaying stale speed.
    */

    document.getElementById("speed").textContent =
        "0.0";


    lastPosition = null;

    speedHistory = [];
}


/* -----------------------------------------
   BUTTON
----------------------------------------- */

function toggleTracking() {

    if (tracking) {

        stopTracking();

    } else {

        startTracking();
    }
}

</script>

</body>
</html>
